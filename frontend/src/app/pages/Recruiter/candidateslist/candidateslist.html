<app-sidebar></app-sidebar>
<div class="candidates-container">

  <!-- filtres statiques -->
  <div class="filters">
    <div class="search">
      <i class="fa fa-search" style="color:#94a3b8"></i>
      <input type="text" placeholder="Rechercher un candidat, compétence..." />
    </div>

    <select aria-label="Filtrer par offre">
      <option>Toutes les offres</option>
      <option>Développeur Angular</option>
      <option>Data Scientist</option>
      <option>UX Designer</option>
    </select>

    <select aria-label="Filtrer par statut">
      <option>Tous les statuts</option>
      <option>En attente</option>
      <option>En entretien</option>
      <option>Accepté</option>
      <option>Rejeté</option>
    </select>

    <div class="actions">
      <button class="btn" style="background:#fff;border:1px solid #e6e9ef;">Réinitialiser</button>
    </div>
  </div>
  <div class="row">
    <app-candidates-card></app-candidates-card>
    <app-candidates-card></app-candidates-card>
    <app-candidates-card></app-candidates-card>
  </div>
</div>
