<h2 mat-dialog-title>Confirmation de Supression</h2>
<mat-dialog-content>
 	<p>Etes vous sûr de vouloir supprimer cette offre ?</p>
</mat-dialog-content>
<mat-dialog-actions>
 	<button mat-button [mat-dialog-close]="false">Non</button>
 	<button mat-flat-button [mat-dialog-close]="true">Oui</button>
</mat-dialog-actions>
