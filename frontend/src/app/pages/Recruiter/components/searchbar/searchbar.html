<div class="filters">
    <div class="search">
      <i class="fa fa-search" style="color:#94a3b8"></i>
      <input type="text" placeholder="Rechercher une offre..." [(ngModel)]="searchTerm" (input)="onSearch()" />
    </div>

    <select [(ngModel)]="statuts" (change)="onSearch()" aria-label="Filtrer par statut">
      <option value="all">Tous les statuts</option>
      <option value="active">Actif</option>
      <option value="inactive">Fermé</option>
    </select>
  </div>
